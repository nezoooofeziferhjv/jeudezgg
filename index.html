<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Snake Game - Start Edition</title>
    <style>
        body { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; background: #0a0a0a; 
            color: white; font-family: 'Arial Black', sans-serif; flex-direction: column; 
        }

        /* Le bouton PLAY style néon bleu comme ton image */
        #playButton {
            padding: 20px 60px;
            font-size: 40px;
            color: #008cff;
            background: #001529;
            border: 4px solid #008cff;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 5px;
            box-shadow: 0 0 20px #008cff, inset 0 0 15px #008cff;
            text-shadow: 0 0 10px #008cff;
            transition: 0.3s;
        }

        #playButton:hover {
            background: #008cff;
            color: white;
            box-shadow: 0 0 50px #008cff;
        }

        /* Cacher le jeu au début */
        #gameContainer { display: none; text-align: center; }
        
        canvas { 
            border: 5px solid #008cff; border-radius: 10px;
            background-color: #000; box-shadow: 0 0 20px rgba(0,140,255,0.4);
        }
        .score { font-size: 24px; margin-bottom: 10px; color: #008cff; }
    </style>
</head>
<body>

    <!-- Écran d'accueil -->
    <div id="startScreen">
        <button id="playButton" onclick="startGame()">PLAY</button>
    </div>

    <!-- Conteneur du jeu -->
    <div id="gameContainer">
        <div class="score">Score : <span id="scoreVal">0</span></div>
        <canvas id="snakeGame" width="400" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("scoreVal");
        let gameLoop;

        let box = 20;
        let score = 0;
        let d = "RIGHT";
        let snake = [{ x: 10 * box, y: 10 * box }];
        let food = { x: Math.floor(Math.random() * 19) * box, y: Math.floor(Math.random() * 19) * box };

        // Fonction pour lancer le jeu
        function startGame() {
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("gameContainer").style.display = "block";
            gameLoop = setInterval(draw, 100);
        }

        document.addEventListener("keydown", (e) => {
            if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if(e.keyCode == 38 && d != "DOWN") d = "UP";
            else if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if(e.keyCode == 40 && d != "UP") d = "DOWN";
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Serpent
            for(let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#008cff" : "#004a87"; // Bleu pour assortir au bouton
                ctx.beginPath();
                ctx.arc(snake[i].x + box/2, snake[i].y + box/2, box/2 - 1, 0, 2 * Math.PI);
                ctx.fill();
                if(i == 0) {
                    ctx.fillStyle = "white";
                    ctx.beginPath();
                    ctx.arc(snake[i].x + 6, snake[i].y + 6, 3, 0, 2 * Math.PI);
                    ctx.arc(snake[i].x + 14, snake[i].y + 6, 3, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }

            // Nourriture
            ctx.fillStyle = "#ff004c";
            ctx.beginPath();
            ctx.arc(food.x + box/2, food.y + box/2, box/2 - 2, 0, 2 * Math.PI);
            ctx.fill();

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if(d == "LEFT") snakeX -= box;
            if(d == "UP") snakeY -= box;
            if(d == "RIGHT") snakeX += box;
            if(d == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y) {
                score++;
                scoreElement.innerHTML = score;
                food = { x: Math.floor(Math.random() * 19) * box, y: Math.floor(Math.random() * 19) * box };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(gameLoop);
                alert("Game Over ! Score : " + score);
                location.reload();
            }
            snake.unshift(newHead);
        }

        function collision(head, array) {
            for(let i = 0; i < array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }
    </script>
</body>
</html>
